<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceMeet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>VoiceMeet</h1>
            <div id="header-controls">
                <button id="language-toggle" aria-label="Switch language">עברית / English</button>
                <div id="google-signin-wrap">
                    <div id="google-signin-button"></div>
                    <span id="signin-status"></span>
                </div>
            </div>
        </header>

        <main>
            <div id="conversation">
                <div class="message system" id="initial-message">
                    לקביעת פגישה אפשר ללחוץ על המיקרופון ולתת פרטים
                </div>
            </div>

            <button id="mic-button" aria-label="Start recording">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>

            <p id="status"></p>
            <div id="schedule-wrap" class="hidden">
                <button type="button" id="schedule-button"></button>
            </div>
        </main>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js"></script>
</body>
</html>
